];
const KIL_TABLES = {};
const KIL_UNCLASSIFIED = [];
function buildKilTables(){
  KIL_TABLE_DEF.forEach(t => { KIL_TABLES[t.id] = []; });
  KIL_UNCLASSIFIED.length = 0;
  DECLARED.forEach(e => {
    const def = KIL_TABLE_DEF.find(t => t.from === kilOf(e.from) && t.to === kilOf(e.to));
    (def ? KIL_TABLES[def.id] : KIL_UNCLASSIFIED).push(e);
  });
}

/* ============================================================

   The register's own repairs[] below asserts 115 distinct department
   strings across 499 assets. That claim isn't fabricated here — it isn't
   re-derivable here either: CDA_Live_Dashboard_Template.xlsx itself was

   per domain. The only variant pairs evidenced anywhere in this estate
   are the three named in the repairs entry. This resolver is built and
   demonstrated against those three, wired into the two that actually
   appear in CDA_DOM — a working mechanism ready to run at full scale
   the moment the real per-asset data is available, not a claim that the
   115-string problem is solved.
   ============================================================ */
const ORG_ALIASES = [
  { pref:'Office for National Statistics', alt:['ONS'] },
  { pref:'Department for Education', alt:['DfE'] },
  { pref:'Department for Environment, Food & Rural Affairs', alt:['DEFRA','Defra'] }
];
function resolveOrg(raw){
  const hit = ORG_ALIASES.find(a => a.alt.includes(raw));
  return hit ? hit.pref : raw;
}
function deptDisplay(raw){
  const resolved = resolveOrg(raw);
  return resolved === raw ? resolved : `${resolved} (recorded as “${raw}”)`;
}

function makeCdaCollection(){
  const strands=[], enrich={}, themes=[], typeDom={};
  Object.entries(CDA_DOM).forEach(([d,v]) => Object.keys(v.types).forEach(t => (typeDom[t]=typeDom[t]||[]).push(d)));
  Object.entries(typeDom).filter(([t,d]) => d.length >= 3).forEach(([t]) =>
    themes.push({ id:'ct-'+t.replace(/\W+/g,''), label:t, note:`Asset type present in ${typeDom[t].length} of the five domains.` }));
  const pct = n => Math.round(n*100) + '%';
  Object.entries(CDA_DOM).sort((a,b)=>b[1].n-a[1].n).forEach(([dom,v], i) => {
    const id='d'+i;
    const nodes=[{ t:dom, k:`${v.n} assets`, themes:[],
      b:`${v.n} critical data assets. Mean DAM compliance ${pct(v.dam)}, discovery readiness ${pct(v.disc)}, NDL readiness ${pct(v.ndl)}. Enterprise value ${v.evs}. ${v.crit} rated Critical impact, ${v.flag} classified Flagship.`,
      c:[`Assets: ${v.n}`,`DAM compliance: ${pct(v.dam)}`,`Discovery readiness: ${pct(v.disc)}`,`NDL / valuation readiness: ${pct(v.ndl)}`,`Mean enterprise value: ${v.evs}`,`Critical impact: ${v.crit}`,`Flagship: ${v.flag}`,`Largest holder: ${deptDisplay(v.dept)}`],
      open: v.ndl < 0.45 }];
    enrich[id+':0']={ cls:'Capability', tax:'meas/value', kisil:'I2', rel:[] };
    const _cdaAll = Object.entries(v.types).sort((a,b)=>b[1].n-a[1].n);
    _cdaAll.slice(0,8).forEach(([t,m], j) => {
      nodes.push({ t, k:`${m.n} \u00b7 EVS ${m.evs}`, themes:themes.filter(x=>x.label===t).map(x=>x.id),
        b:`${m.n} ${t.toLowerCase()} assets in ${dom}. DAM ${pct(m.dam)}, discovery ${pct(m.disc)}, NDL ${pct(m.ndl)}, enterprise value ${m.evs}.`,
        c:[`Count: ${m.n}`,`DAM compliance: ${pct(m.dam)}`,`Discovery readiness: ${pct(m.disc)}`,`NDL readiness: ${pct(m.ndl)}`,`Enterprise value: ${m.evs}`],
        open: m.ndl < 0.4 });
      enrich[`${id}:${j+1}`]={ cls:CDA_CLS[t]||'Register', tax:'desc/metadata', kisil:'I', rel:[['partOf', id+':0']] };
    });
    /* level of detail: truncation is declared, never silent (BL-WEB-12/14) */
    if (_cdaAll.length > 8){
      const rest = _cdaAll.slice(8);
      nodes.push({ t:`+${rest.length} more type${rest.length===1?'':'s'}`, k:'aggregate \u00b7 undrawn',
        b:`${rest.length} further asset type${rest.length===1?'':'s'} in ${dom}, aggregated here so the ring stays readable. Every member is listed below and in the text version \u2014 nothing is silently dropped.`,
        c:rest.map(([t,m]) => `${t} \u00b7 ${m.n} assets \u00b7 EVS ${m.evs}`) });
      enrich[`${id}:9`]={ cls:'Register', tax:'desc/metadata', kisil:'I', rel:[['partOf', id+':0']] };
    }
    strands.push({ id, key:String(i+1), angle:0, colour:PALETTE[i%PALETTE.length], label:dom,
      meta:`${v.n} assets \u00b7 EVS ${v.evs}`, url:'', state: v.ndl<0.45?'in-flight':'complete',
      summary:`${dom} holds ${v.n} of the 499 critical data assets. Mean enterprise value ${v.evs}; NDL and valuation readiness ${pct(v.ndl)}.`, nodes });
  });
  const deptsUsed = Object.values(CDA_DOM).map(v => v.dept);
  const resolutions = ORG_ALIASES
    .map(a => ({ canonical:a.pref, mergedFrom:a.alt.filter(x => deptsUsed.includes(x)) }))
    .filter(r => r.mergedFrom.length);
  return { id:'cda', hub:['critical data assets','499 \u00b7 live register'],

function makeStd5Collection(){
  const strands=[], enrich={};
  const themes=[
    { id:'s-endorsed', label:'Endorsed', note:'Topics whose standards are formally endorsed for UK government use.' },
    { id:'s-partial',  label:'Partially endorsed', note:'Topics with partial endorsement \u2014 some standards agreed, others still contested.' },
    { id:'s-draft',    label:'Draft', note:'Topics still in draft at v5.0. These are what the consultation is asking about.' }
  ];
  const st = s => s === 'Endorsed' ? 's-endorsed' : (s === 'Draft' ? 's-draft' : 's-partial');
  Object.entries(STD5).forEach(([num, dom], i) => {
    const id='v'+num, isNew = dom.name.includes('[NEW]');
    const clean = dom.name.replace(' [NEW]','');
    const counts = dom.topics.reduce((a,t) => (a[t.s]=(a[t.s]||0)+1, a), {});
    const nodes=[{ t:`${num}. ${clean}`, k:isNew?'New in v5.0':'Domain', themes:dom.topics.map(t=>st(t.s)).filter((v,k,a)=>a.indexOf(v)===k),
      b:`Domain ${num} of the v5.0 classification${isNew?', introduced in this version':''}. ${dom.topics.length} topics listed. ${Object.entries(counts).map(([k,v])=>`${v} ${k.toLowerCase()}`).join(', ')}.`,
      c:dom.topics.map(t => `${t.c} ${t.n} \u00b7 ${t.s}`), open:isNew }];
    enrich[id+':0']={ cls:'Capability', tax:'govern/policy', kisil:'K', rel:[] };
    dom.topics.slice(0,9).forEach((t, j) => {
      nodes.push({ t:`${t.c} ${t.n}`, k:t.s, themes:[st(t.s)],
        b:`Topic ${t.c} of domain ${num}. Status: ${t.s}.`,
        c:[`Standards: ${t.ex}`,`Status: ${t.s}`,`Domain: ${clean}`], open:t.s==='Draft' });
      enrich[`${id}:${j+1}`]={ cls:'Standard', tax:'govern/policy', kisil:t.s==='Endorsed'?'K':'L', rel:[['partOf', id+':0']] };
    });
    /* level of detail: the '9 of 15' truncation becomes a declared aggregate */
    if (dom.topics.length > 9){
      const rest = dom.topics.slice(9);
      nodes.push({ t:`+${rest.length} more topic${rest.length===1?'':'s'}`, k:'aggregate \u00b7 undrawn',
        b:`${rest.length} further topic${rest.length===1?'':'s'} in this domain, aggregated so the ring stays readable. Every member is listed below with its status \u2014 nothing is silently dropped.`,
        c:rest.map(t => `${t.c} ${t.n} \u00b7 ${t.s}`), open:rest.some(t => t.s==='Draft') });
      enrich[`${id}:10`]={ cls:'Standard', tax:'govern/policy', kisil:'K', rel:[['partOf', id+':0']] };
    }
    strands.push({ id, key:String(i+1), angle:0, colour:PALETTE[i%PALETTE.length], label:clean,
      meta:`Domain ${num} \u00b7 ${dom.topics.length} topics${isNew?' \u00b7 NEW':''}`, url:'',
      state:isNew?'in-flight':(counts['Draft']?'in-flight':'complete'),
      summary:`${clean}. ${dom.topics.length} topics.${isNew?' Introduced in v5.0 and out for consultation.':''}`, nodes });
  });
  return { id:'std', hub:['data standards','classification v5.0'],
    label:'UK Gov Data Standards Classification v5.0 (draft)', strands, themes, enrich,
    repairs:[
      { t:'59% complete overall', d:'The status dashboard records 66 topics planned, 39 complete and 27 to be confirmed. Domains 6 and 7 sit at 25% and 22%.', s:'' },
      { t:'The two new domains are the least developed', d:'Governance, Ethics & Trust and AI, ML & Emerging Technologies were introduced in v5.0 and are the thinnest \u2014 which is exactly what the consultation brief asks stakeholders about.', s:'v6' },
      { t:'17 of 57 topics are still Draft', d:'35 endorsed, 5 partially endorsed, 17 draft. Partial endorsement is the harder category: some standards agreed, others contested, with no visible record of which.', s:'' },
      { t:'Subject tier still not populated', d:'The scheme is Domain \u2192 Topic \u2192 Subject. Subjects appear as free-text areas of scope rather than as a controlled third tier.', s:'' },
      { t:'Domains 5, 6 and 7 exceed the ring budget', d:'Domain 5 carries 18 topics; the web shows the first 9. Same layout limit as v4.4, now more visible.', s:'v5' }
    ]};
}

function makeXwalkCollection(){
  const strands=[], enrich={}, themes=[];
  const typeVocab={};
  Object.entries(XWALK).forEach(([v,tt]) => Object.keys(tt).forEach(t => (typeVocab[t]=typeVocab[t]||[]).push(v)));
  Object.entries(typeVocab).filter(([t,v]) => v.length >= 2).forEach(([t]) =>
    themes.push({ id:'x-'+t, label:t, note:`Term type declared by ${typeVocab[t].length} vocabularies in the crosswalk.` }));
  const XCLS={ Class:'Concept', Property:'Standard', Standard:'Standard', Concept:'Concept', Profile:'Method' };
  Object.entries(XWALK).sort((a,b) => Object.values(b[1]).reduce((x,y)=>x+y,0) - Object.values(a[1]).reduce((x,y)=>x+y,0))
    .forEach(([v, tt], i) => {
      const id='x'+i, total=Object.values(tt).reduce((a,b)=>a+b,0);
      const nodes=[{ t:v, k:`${total} terms`, themes:Object.keys(tt).map(t=>'x-'+t).filter(t=>themes.some(x=>x.id===t)),
        b:`${v} contributes ${total} terms to the crosswalk, across ${Object.keys(tt).length} term type${Object.keys(tt).length===1?'':'s'}.`,
        c:Object.entries(tt).map(([k,n]) => `${k}: ${n}`), open:total<5 }];
      enrich[id+':0']={ cls:'Capability', tax:'desc/vocab', kisil:'K', rel:[] };
      Object.entries(tt).sort((a,b)=>b[1]-a[1]).forEach(([t,n], j) => {
        nodes.push({ t:`${t} \u00b7 ${n}`, k:t, themes:themes.filter(x=>x.label===t).map(x=>x.id),
          b:`${n} ${t.toLowerCase()} term${n===1?'':'s'} contributed by ${v}.`, c:[`Vocabulary: ${v}`,`Term type: ${t}`,`Count: ${n}`] });
        enrich[`${id}:${j+1}`]={ cls:XCLS[t]||'Concept', tax:'desc/vocab', kisil:'I', rel:[['partOf', id+':0']] };
      });
      strands.push({ id, key:String(i+1), angle:0, colour:PALETTE[i%PALETTE.length], label:v,
        meta:`${total} terms \u00b7 ${Object.keys(tt).length} type${Object.keys(tt).length===1?'':'s'}`, url:'',
        state: total<5?'dormant':'complete',
        summary:`${v} in the standards crosswalk. ${total} terms across ${Object.keys(tt).length} term type${Object.keys(tt).length===1?'':'s'}.`, nodes });
    });
  return { id:'xwalk', hub:['standards crosswalk','61 concepts \u00b7 212 terms'],
    label:'Data Cataloguing Standards & Tooling Crosswalks', strands, themes, enrich,
    repairs:[
      { t:'Five vocabularies contribute fewer than five terms each', d:'NDL, DAM Policy and the Discoverability Platform appear as concepts only. The cross-government layer is thin next to DCAT v3, which alone supplies 84 of 212 terms.', s:'' },
      { t:'GOV.UK Open Standards contributes only standards', d:'Twenty entries, all of type Standard, with no classes or properties. It names what to comply with but not what to record.', s:'' },
      { t:'Concept mappings are indicative, not normative', d:'The tool and supplier crosswalk is explicitly labelled indicative. Twenty-six concepts across six catalogue tools \u2014 useful for orientation, not for procurement evidence.', s:'' },
      { t:'No machine-readable export yet', d:'The Rosetta Stone maps 61 concepts across ten profiles by hand. Nothing emits SKOS or JSON-LD, so the crosswalk cannot be applied automatically. Backlog BL-WEB-23.', s:'' }
    ]};
}

    themes.push({ id:'t-' + t.replace(/\W+/g,''), label:t, note:`Delivery type appearing across ${typeAreas[t].length} of the nine 2026 areas.` }));

  Object.entries(GDS_AREAS).forEach(([area, types], i) => {
    const id = 'a' + i, total = Object.values(types).reduce((a,b)=>a+b,0);
    const _gdsAll = Object.entries(types).sort((a,b) => b[1]-a[1]);
    const list = _gdsAll.slice(0, 8);

        c:[`Type: ${t}`, `Count: ${n}`, `Area: ${area}`] });
      enrich[`${id}:${j+1}`] = { cls:GDS_CLS[t] || 'Concept', tax:'del/docs', kisil:'I', rel:[['partOf', id + ':0']] };
    });

      summary:`One of the nine GDS DTx areas the 2026 catalogue maps products, services and pipeline entries onto. ${total} items in total.`,

    repairs:[
      { t:'120 of 173 mappings are inferred', d:'Only 25 area mappings are marked [OK]. 120 are [INFERRED] and 26 are flagged [REVIEW]. The estate view rests on machine inference that has not been confirmed by owners.', s:'' },
      { t:'Two items are unmapped entirely', d:'One guidance item and one community item carry no 2026 area at all.', s:'a7' },

/* ============================================================
   3. Rebuilding the geometry for a different collection
   ============================================================ */
function buildGeom(col){
  ['gFrame','gSpiral','gRadii','gChords','gOnto','gAlt','gBridge','gRoute','gPulse','gNodes','gPlanes','gRadiiS','gRisers']
    .forEach(id => { const g = document.getElementById(id); if (g) g.innerHTML = ''; });
  NODEREFS.length = 0; Object.keys(byKey).forEach(k => delete byKey[k]);
  Object.keys(FRAME_R).forEach(k => delete FRAME_R[k]);

  const n = col.strands.length, maxN = Math.max(...col.strands.map(s => s.nodes.length));
  const step = Math.min(50, Math.max(30, (400 - 100) / Math.max(1, maxN - 1)));
  col.strands.forEach((s, i) => {
    s.angle = -90 + i * (360 / n);
    FRAME_R[s.id] = 450 + (i % 3) * 9;
    const cosA = Math.cos(s.angle * RAD);
    if (s.lab === undefined) s.lab = Math.abs(cosA) < .2 ? (i % 2 ? 0 : 180) : (cosA >= 0 ? 0 : 180);
  });

  /* frame + guys */
  const gF = document.getElementById('gFrame');
  const verts = col.strands.map(s => ({ ...pt(s.angle, FRAME_R[s.id]), a:s.angle }));
  let d = '';
  verts.forEach((v, i) => {
    const nx = verts[(i + 1) % verts.length];
    const mid = (v.a + (i === verts.length - 1 ? nx.a + 360 : nx.a)) / 2;
    const c = pt(mid, FRAME_R[col.strands[i].id] * 0.9);
    d += (i === 0 ? `M${v.x},${v.y}` : '') + ` Q${c.x},${c.y} ${nx.x},${nx.y}`;
  });
  gF.appendChild(el('path', { d, class:'frame-thread' }));
  ANCHORS.forEach(a => {
    verts.map(v => ({ v, dd:(v.x-a.x)**2 + (v.y-a.y)**2 })).sort((p,q) => p.dd-q.dd).slice(0,2)
      .forEach(nn => gF.appendChild(el('line', { x1:a.x, y1:a.y, x2:nn.v.x, y2:nn.v.y, class:'guy' })));
    gF.appendChild(el('circle', { cx:a.x, cy:a.y, r:3, fill:'var(--ridge)', stroke:'var(--faint)', 'stroke-width':1 }));
    const lb = el('text', { x:a.x + (a.ta === 'start' ? 10 : -10), y:a.y + 4, class:'anchor-lbl', 'text-anchor':a.ta });
    lb.textContent = a.t; gF.appendChild(lb);
  });

  /* spiral */
  const gS = document.getElementById('gSpiral');
  let sd = '', prev = null;
  for (let ring = 0; ring < Math.min(9, maxN + 1); ring++)
    for (let i = 0; i < n; i++){
      const a = col.strands[i].angle + 360 * ring, r = 100 + ring * step + (i / n) * step, p = pt(a, r);
      if (!prev) sd += `M${p.x.toFixed(1)},${p.y.toFixed(1)}`;
      else { const c = pt((prev.a + a) / 2, (prev.r + r) / 2 * .945); sd += ` Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}`; }
      prev = { a, r };
    }
  gS.appendChild(el('path', { d:sd, class:'spiral' }));

  /* radii + beads */
  const gR = document.getElementById('gRadii'), gN = document.getElementById('gNodes');
  col.strands.forEach((s, si) => {
    const end = pt(s.angle, FRAME_R[s.id]);
    const line = el('line', { x1:CX, y1:CY, x2:end.x, y2:end.y, class:'radius' });
    line.style.setProperty('--strand-c', s.colour); line.dataset.s = s.id;
    gR.appendChild(line); s._radius = line; s._frameEnd = end;

    const lp = pt(s.angle, FRAME_R[s.id] + 30), cs = Math.cos(s.angle*RAD), sn = Math.sin(s.angle*RAD);
    const sl = el('text', { x:lp.x, y:lp.y + (sn > .4 ? 16 : (sn < -.4 ? -18 : -2)), class:'strand-lbl',
      'text-anchor':cs > .25 ? 'start' : (cs < -.25 ? 'end' : 'middle') });
    sl.style.setProperty('--strand-c', s.colour);
    splitLabel(s.label).forEach((ln, k) => { const ts = el('tspan', { x:lp.x, dy:k ? 18 : 0 }); ts.textContent = ln; sl.appendChild(ts); });
    sl.addEventListener('click', () => selectStrand(s.id));
    gR.appendChild(sl);

    const pa = s.lab, px = Math.cos(pa*RAD), py = Math.sin(pa*RAD);
    const lAnchor = px > .05 ? 'start' : 'end', off = 15;
    s._lab = { px, py, off, anchor:lAnchor };

    s.nodes.forEach((nd, j) => {
      const r = 100 + j * step, p = pt(s.angle, r), nid = s.id + ':' + j;
      const cls = (col.enrich[nid] || {}).cls || 'Concept';
      const ep = (function(){ const e = nd.ep || (col.enrich[nid]||{}).ep || 'asserted'; return EP_STATES.includes(e) ? e : 'asserted'; })();
      const g = el('g', { class:'node' + (nd.open ? ' open' : '') + (ep !== 'asserted' ? ' ep-' + ep : ''), tabindex:'0', role:'button' });
      g.dataset.s = s.id; g.dataset.j = j;
      g.style.setProperty('--strand-c', `var(--sc-${s.id})`);
      g.appendChild(el('circle', { class:'halo', cx:p.x, cy:p.y, r:17, fill:'transparent', 'pointer-events':'all' }));
      g.appendChild(el('path', { class:'bead', d:shapePath(SHAPEOF(cls), p.x, p.y, j === 0 ? 6.6 : 5.4) }));
      g.setAttribute('aria-label', `${nd.t}. ${s.label}. Class ${cls}.${ep !== 'asserted' ? ' Epistemic state ' + ep + '.' : ''} ${nd.b}`);
      const clsTx = el('text', { class:'cls-lbl', x:p.x + px*off, y:p.y + py*off - 7.5, 'text-anchor':lAnchor });
      clsTx.textContent = cls; g.appendChild(clsTx);
      const tx = el('text', { class:'lbl', x:p.x + px*off, y:p.y + py*off + 3.5, 'text-anchor':lAnchor });
      tx.textContent = nd.t; g.appendChild(tx); gN.appendChild(g);

      const ref = { s, si, nd, j, p, p0:{ x:p.x, y:p.y }, rad:r, size:j === 0 ? 6.6 : 5.4, shape:SHAPEOF(cls),
        g, bead:g.querySelector('.bead'), lblEl:tx, clsEl:clsTx, ep,
        hay:(s.label + ' ' + nd.t + ' ' + nd.k + ' ' + nd.b + ' ' + (nd.c||[]).join(' ')).toLowerCase() };
      NODEREFS.push(ref); byKey[nid] = ref;
      const meta = () => { const e2 = col.enrich[nid] || {}; return [s.label, e2.cls, flatTax()[e2.tax]].filter(Boolean).join(' \u00b7 '); };
      g.addEventListener('mouseenter', e => tip(e, nd.t, meta()));
      g.addEventListener('mousemove', e => tip(e, nd.t, meta()));
      g.addEventListener('mouseleave', hideTip);
      g.addEventListener('focus', () => tipAtEl(g, nd.t, meta()));
      g.addEventListener('blur', hideTip);
      g.addEventListener('click', () => selectNode(s.id, j));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectNode(s.id, j); } });
    });
  });

  /* hub caption for this collection */
  const hl = document.querySelectorAll('#gHub .hub-lbl');
  if (hl[1]) hl[1].textContent = col.hub[0];
  if (hl[2]) hl[2].textContent = col.hub[1];
  if (hl[0]) hl[0].textContent = col.id === 'web' ? 'UK central government' : col.label.split(' ').slice(0,3).join(' ');
}

function rebuildEdges(col){
  EDGES.length = 0; DECLARED.length = 0;
  Object.entries(col.enrich).forEach(([from, e]) => (e.rel || []).forEach(([prop, to]) => {
    if (!byKey[to]) return;
    EDGES.push({ from, to, prop, declared:true });
    const inv = PROPOF(prop).inv;
    if (inv && inv !== prop) EDGES.push({ from:to, to:from, prop:inv, declared:false });
  }));
  DECLARED.push(...EDGES.filter(e => e.declared));
  /* recompute the reasoner in place */
  const types = {}, inf = {};
  NODEREFS.forEach(r => { const id = key(r), a = CLSOF(id); types[id] = new Set([a]); inf[id] = new Set(ancestorsOf(a).slice(1)); });
  REASON.types = types; REASON.inferredTypes = inf;
  REASON.extra.length = 0; REASON.clashes.length = 0; REASON.observed.length = 0;
  REASON.notes.length = 0;
  REASON.notes.push(`Materialised ${EDGES.length - DECLARED.length} inverse assertions from ${DECLARED.length} declared.`);
  REASON.notes.push(DECLARED.length ? 'Domains and ranges confirmed every assertion; nothing new inferred.'
    : 'No declared relations in this collection \u2014 the source records classification, not relationships. There is nothing for the reasoner to work on.');
  REASON.notes.push('Transitivity added nothing \u2014 no chain runs more than one step.');
  REASON.notes.push('Symmetry added nothing.');
  REASON.notes.push('Consistent: no individual holds two disjoint classes.');
  ONTOLOGY.forEach(o => {
    const inst = instancesOfClass(o.id); if (inst.length < 2) return;
    Object.keys(PROP_META).forEach(p => {
      const w = inst.filter(r => EDGES.some(e => e.from === key(r) && e.prop === p));
      if (w.length === inst.length && w.length)
        REASON.observed.push({ cls:o.id, prop:p, n:inst.length, fillers:[...new Set(inst.flatMap(r => EDGES.filter(e => e.from === key(r) && e.prop === p).map(e => CLSOF(e.to))))] });
    });
  });
}

function loadCollection(id){
  const col = COLLECTIONS[id]; if (!col) return;
  CURRENT = id;
  STRANDS.length = 0; STRANDS.push(...col.strands);
  THEMES.length = 0;  THEMES.push(...col.themes);
  Object.keys(ENRICH).forEach(k => delete ENRICH[k]); Object.assign(ENRICH, col.enrich);
  REPAIRS.length = 0; REPAIRS.push(...col.repairs);

  const sc = document.createElement('style');
  sc.id = 'colColours';
  sc.textContent = ':root{' + col.strands.map((s,i) => `--sc-${s.id}:${s.colour};`).join('') + '}';
  const old = document.getElementById('colColours'); if (old) old.remove();
  document.head.appendChild(sc);

  if (STRATA.on) toggleStrata(false);
  buildGeom(col); rebuildEdges(col); buildKilTables();
  TRAIL.length = 0; VISITED.clear();

  document.getElementById('strandList').innerHTML = '';
  document.getElementById('themeChips').innerHTML = '';
  document.getElementById('repairList').innerHTML = '';
  STRANDS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'strand-btn'; b.dataset.s = s.id;
    b.style.setProperty('--strand-c', `var(--sc-${s.id})`);
    b.innerHTML = `<span class="nm"><span class="dot"></span>${esc(s.label)}</span><span class="sub">${esc(s.key)} \u00b7 ${esc(s.meta)}</span>`;
    b.addEventListener('click', () => selectStrand(s.id));
    document.getElementById('strandList').appendChild(b);
  });
  THEMES.forEach(t => {
    const cnt = NODEREFS.filter(r => (r.nd.themes||[]).includes(t.id)).length;
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.t = t.id;
    b.innerHTML = `${esc(t.label)}<span class="ct">${cnt}</span>`;
    b.addEventListener('click', () => selectTheme(t.id));
    document.getElementById('themeChips').appendChild(b);
  });
  REPAIRS.forEach(r => {
    const li = document.createElement('li');
    li.innerHTML = `<b>${esc(r.t)}</b>${esc(r.d)}`;
    if (r.s && byKey[r.s + ':0']) { li.style.cursor = 'pointer'; li.addEventListener('click', () => selectStrand(r.s)); }
    document.getElementById('repairList').appendChild(li);
  });

  document.getElementById('mmContent').innerHTML = '';
  const clone = document.getElementById('vp').cloneNode(true);
  clone.removeAttribute('transform'); clone.removeAttribute('id'); clone.style.pointerEvents = 'none';
  clone.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
  clone.querySelectorAll('text, .halo, .chord, .pulse, .ripple').forEach(x => x.remove());
  clone.querySelectorAll('[tabindex]').forEach(x => x.removeAttribute('tabindex'));
  document.getElementById('mmContent').appendChild(clone);

  ['tStrands','tNodes','tThemes','tRels','tOpen'].forEach((k, i) =>
    { const e = document.getElementById(k); if (e) e.textContent = [STRANDS.length, NODEREFS.length, THEMES.length, DECLARED.length, REPAIRS.length][i]; });
  document.querySelectorAll('.colpick').forEach(s => s.value = id);
  VPmain.reset(); reset(); renderRef(refWhich); buildListView();
  say('Loaded ' + col.label + '. ' + STRANDS.length + ' threads, ' + NODEREFS.length + ' beads.');
}

function buildListView(){
  document.getElementById('lvBody').innerHTML = STRANDS.map(s => `
    <div class="lv-strand">
      <button class="lv-head" style="--strand-c:var(--sc-${s.id})" data-s="${s.id}">${esc(s.label)}
        <span class="sub">${esc(s.meta)} \u00b7 ${s.nodes.length} beads</span></button>
      <ul class="lv-items">${s.nodes.map((n, j) => {
        const e2 = ENRICH[s.id + ':' + j] || {};
        return `<li><button data-s="${s.id}" data-j="${j}">${esc(n.t)}<span class="cls">${esc(e2.cls || '')}${n.open ? ' \u00b7 still open' : ''}</span></button></li>`;
      }).join('')}</ul></div>`).join('');
  document.querySelectorAll('#lvBody .lv-head').forEach(b => b.addEventListener('click', () => selectStrand(b.dataset.s)));
  document.querySelectorAll('#lvBody .lv-items button').forEach(b => b.addEventListener('click', () => selectNode(b.dataset.s, +b.dataset.j)));
}

/* EDGES/DECLARED for the native 'web' collection are built once at parse
   time by chunk 44, not through rebuildEdges() — loadCollection() never
   runs at boot. Mirror that: classify the tables once here too, so the
   substrate is populated on a cold load, not only after a collection
   switch. Defect found while wiring XDMH-200: the same gap would have
   silently left KIL_TABLES empty at boot. */
buildKilTables();
</script>
