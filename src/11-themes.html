<style>
/* ============================================================
   Themes. Dark is dew before dawn; light is silk on paper.
   ============================================================ */
[data-theme="light"]{
  --night:#f4f1e9;
  --deep:#fbfaf6;
  --dusk:#eae5d9;
  --ridge:#cfc7b6;
  --silk:#1d2128;
  --moth:#4e5665;
  --faint:#646c7a;
  --dew:#0e6f6a;
  --dew-dim:#8fc9c5;
  --amber:#9a5c07;
  --amber-dim:#d9a95e;
  --rust:#a63d1c;
  --violet:#5b46a8;
  --ok:#2c7048;
  --shadow:0 16px 44px -26px rgba(40,36,26,.5);
  --glass:rgba(251,250,246,.9);
  --glass-solid:rgba(251,250,246,.98);
  --spiralc:rgba(90,98,112,.34);
  --violet-wash:rgba(91,70,168,.12);
  --amber-wash:rgba(154,92,7,.12);
  --mm-bg:rgba(244,241,233,.85);
  --alt1:#6b57ad;
  --alt2:#2f6f58;
  --alt3:#8a4a24;
  --sc-gov:#0f7a74; --sc-cda:#8a5a08; --sc-obs:#523f99; --sc-cat:#1d6a45; --sc-apps:#94411e;

  /* taxonomic layer — light-theme inks of the same ramp */
  --cat-1:#0F6E56; --cat-2:#185FA5; --cat-3:#534AB7; --cat-4:#8a5a08;
  --cat-5:#993C1D; --cat-6:#A32D2D; --cat-7:#5F5E5A; --cat-8:#0C447C;

  /* epistemic layer, light derivations */
  --ep-asserted:#00703c;
  --ep-inferred:#4c2c92;
  --ep-induced:#a05a00;
  --ep-stub:#646c7a;
  --ep-gated:#3b435031;

  /* authority layer, light */
  --gold:#946b00;
  --gold-wash:rgba(148,107,0,.1);
}
[data-theme="light"] body{
  background-image:
    radial-gradient(ellipse 900px 620px at 62% 44%, rgba(14,111,106,.06), transparent 68%),
    radial-gradient(ellipse 700px 500px at 15% 88%, rgba(154,92,7,.05), transparent 70%);
}
[data-theme="light"] .node .bead{fill:var(--deep)}
[data-theme="light"] .hub-core{fill:var(--deep)}

/* ============================================================
   OCDO skin — an alternative visual identity inspired by a UK
   government data-standards design system (two-canvas navy/pale,
   light-weight sans display type, uppercase-tracked mono for
   machine/signal text). Colour and type character only: this
   project has no affiliation with that programme, so its own
   wordmarks, outcome names and footer chain are not reproduced
   here — only the generic design grammar.
   ============================================================ */
[data-theme="ocdo"]{
  --display:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --night:#04102a;
  --deep:#0a2350;
  --dusk:#0d2c5e;
  --ridge:#1c3a6e;
  --silk:#EAF1F8;
  --moth:#B6C8DD;
  --faint:#8EA6C4;
  --dew:#5fd3b4;
  --dew-dim:#2e7a68;
  --amber:#F4B400;
  --amber-dim:#8a6a1f;
  --rust:#f16fa3;
  --violet:#a48be0;
  --ok:#5fd3b4;
  --shadow:0 18px 50px -22px rgba(0,0,0,.85);
  --glass:rgba(4,16,42,.84);
  --glass-solid:rgba(10,35,80,.97);
  --spiralc:rgba(182,200,221,.28);
  --violet-wash:rgba(164,139,224,.14);
  --amber-wash:rgba(244,180,0,.1);
  --mm-bg:rgba(4,16,42,.6);
  --alt1:#a48be0; --alt2:#5fd3b4; --alt3:#f16fa3;
  --sc-gov:#5fd3b4; --sc-cda:#F4B400; --sc-obs:#a48be0; --sc-cat:#7fb0e8; --sc-apps:#f16fa3;

  /* taxonomic layer — the OCDO bright accent family */
  --cat-1:#5fd3b4; --cat-2:#7fb0e8; --cat-3:#a48be0; --cat-4:#F4B400;
  --cat-5:#f16fa3; --cat-6:#e0777a; --cat-7:#8EA6C4; --cat-8:#5b9fe0;

  --ep-asserted:#5fd3b4;
  --ep-inferred:#a48be0;
  --ep-induced:#F4B400;
  --ep-stub:#8EA6C4;
  --ep-gated:#33507031;

  --gold:#F4B400;
  --gold-wash:rgba(244,180,0,.12);
}
[data-theme="ocdo"] body{
  background-image:radial-gradient(120% 90% at 18% -5%, #0a2350 0%, #061a3c 46%, #04102a 100%);
  background-attachment:fixed;
}
[data-theme="ocdo"] .node .bead{fill:var(--night)}
[data-theme="ocdo"] .hub-core{fill:var(--night)}
[data-theme="ocdo"] .panel{border-radius:3px 15px 15px 3px}
[data-theme="ocdo"] .eyebrow,[data-theme="ocdo"] .mono,[data-theme="ocdo"] .panel h2,
[data-theme="ocdo"] .ctl,[data-theme="ocdo"] .tally .k{letter-spacing:.16em}

/* High contrast: strip washes, thicken silk, maximise text contrast */
[data-contrast="high"]{
  --moth:var(--silk); --faint:#9aa6b8; --ridge:#6b7789; --spiralc:rgba(180,190,205,.6);
}
[data-theme="light"][data-contrast="high"]{ --faint:#3b4350; --ridge:#4a5260; --spiralc:rgba(60,68,80,.55); }
[data-contrast="high"] .radius{opacity:.95;stroke-width:1.4}
[data-contrast="high"] .node .bead{stroke-width:2.4}
[data-contrast="high"] .node .lbl{font-weight:700}
[data-contrast="high"] .panel{border-width:2px}

/* Colour-safe: deuteranopia/protanopia-friendly hues */
[data-palette="safe"]{
  --dew:#38a5d6; --violet:#b07fd8; --amber:#e8b33a; --ok:#7fb2e8; --rust:#d0762b;
  --alt1:#9d8bd0; --alt2:#5fa3cf; --alt3:#c08a3a;
  --sc-gov:#4fa8dd; --sc-cda:#e8b33a; --sc-obs:#b07fd8; --sc-cat:#7fc4e8; --sc-apps:#d0762b;
  /* epistemic states stay legible without red-green: blue/purple/amber/grey,
     and outline style always carries the state regardless of hue */
  --ep-asserted:#5fa3cf; --ep-inferred:#b07fd8; --ep-induced:#e8b33a; --ep-stub:#9aa4ad;
}
[data-theme="light"][data-palette="safe"]{
  --sc-gov:#1a6f9c; --sc-cda:#8a6205; --sc-obs:#6a4a9e; --sc-cat:#2b6d8c; --sc-apps:#984a12;
}

html{font-size:100%}
[data-motion="still"] *{animation:none!important;transition:none!important}

/* ============================================================
   Accessibility furniture
   ============================================================ */
.skip{
  position:absolute;left:-9999px;top:0;z-index:99;background:var(--amber);color:#12161f;
  padding:10px 16px;font-family:var(--body);font-weight:600;border-radius:0 0 var(--r) 0;
}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   Header controls
   ============================================================ */
.mast-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.mast-controls .manual-hint{align-self:center}
.ctl{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--ridge);color:var(--moth);border-radius:2px;
  padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.ctl:hover{color:var(--silk);border-color:var(--faint)}
.ctl[aria-pressed="true"]{color:var(--amber);border-color:var(--amber-dim);background:var(--amber-wash)}

/* ============================================================
   Rail tabs
   ============================================================ */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--ridge);margin-bottom:14px}
.tab{
  flex:1;background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:9px 4px;
}
.tab:hover{color:var(--silk)}
.tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.tabpanel[hidden]{display:none}

.subtabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.subtab{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;border:1px solid var(--ridge);border-radius:100px;color:var(--moth);
  padding:4px 9px;cursor:pointer;
}
.subtab[aria-selected="true"]{background:var(--amber-wash);border-color:var(--amber-dim);color:var(--amber)}

/* reference lists */
.ref-search{
  width:100%;background:var(--night);border:1px solid var(--ridge);border-radius:var(--r);
  color:var(--silk);font-family:var(--body);font-size:13px;padding:8px 10px;margin-bottom:10px;
}
.ref-list{max-height:340px;overflow-y:auto;margin:0;padding:0 4px 0 0;list-style:none}
.ref-list li{padding:9px 0;border-bottom:1px solid var(--ridge)}
.ref-list li:last-child{border-bottom:0}
.ref-term{font-size:13px;font-weight:600;color:var(--silk);display:block}
.ref-def{font-size:12px;color:var(--moth);line-height:1.5;margin-top:3px}
.ref-meta{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:4px;display:block}
.ref-list a,.ref-jump{
  background:none;border:0;padding:0;color:var(--dew);font-size:11.5px;cursor:pointer;
  font-family:var(--body);border-bottom:1px solid rgba(121,214,207,.3);margin-top:5px;display:inline-block;
}
.ref-jump:hover{border-bottom-color:var(--dew)}
.alt-labels{font-size:11.5px;color:var(--faint);font-style:italic;margin-top:3px}

/* taxonomy tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;border-left:1px solid var(--ridge);padding-left:11px}
.tree li{margin:3px 0}
.tree button{
  background:none;border:0;padding:3px 0;cursor:pointer;text-align:left;
  font-family:var(--body);font-size:12.5px;color:var(--moth);width:100%;
}
.tree button:hover{color:var(--silk)}
.tree button.on{color:var(--amber)}
.tree .ct{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:6px}

/* ontology */
.onto-row{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.onto-row:hover .onto-name{color:var(--silk)}
.onto-row.on .onto-name{color:var(--amber)}
.onto-name{font-size:12.5px;color:var(--moth);font-family:var(--body);flex:1}
.onto-ct{font-family:var(--mono);font-size:9px;color:var(--faint)}
.onto-glyph{width:17px;height:17px;flex:0 0 17px}
.onto-glyph path,.onto-glyph circle,.onto-glyph rect{fill:none;stroke:var(--dew);stroke-width:1.5}
.prop-row{
  display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:6px 0;
  font-family:var(--mono);font-size:10.5px;color:var(--moth);letter-spacing:.03em;
}
.prop-row:hover{color:var(--silk)}
.prop-row.on{color:var(--amber)}
.prop-row span{font-family:var(--body);font-size:11.5px;color:var(--faint);display:block;letter-spacing:0;margin-top:2px}

/* ============================================================
   Path lighting — the crawl
   ============================================================ */
@keyframes stepGlow{
  0%{opacity:0;transform:scale(.4)}
  45%{opacity:1;transform:scale(1.5)}
  100%{opacity:0;transform:scale(2.3)}
}
.step-glow{fill:none;stroke:var(--amber);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:stepGlow .85s ease-out forwards}
.node.step .bead{stroke:var(--amber);fill:var(--amber);stroke-width:2.4}
.node.step .lbl{fill:var(--amber);font-weight:700}

@keyframes threadBreathe{
  0%,100%{opacity:.45;stroke-width:1.2}
  50%{opacity:1;stroke-width:2.6}
}
.radius.dominant{stroke:var(--amber);animation:threadBreathe 2.6s ease-in-out infinite}

.route-seg{fill:none;stroke:var(--amber);stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
.route-seg.on{opacity:.95;transition:opacity .3s}
@keyframes routeFlow{to{stroke-dashoffset:-28}}
.route-seg.flow{stroke-dasharray:9 5;animation:routeFlow 1.5s linear infinite}

.alt-seg{fill:none;stroke-width:1.5;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.34;stroke-dasharray:3 6}
.alt-1{stroke:var(--alt1)} .alt-2{stroke:var(--alt2)} .alt-3{stroke:var(--alt3)}
.node.alt1 .bead{stroke:var(--alt1)} .node.alt2 .bead{stroke:var(--alt2)} .node.alt3 .bead{stroke:var(--alt3)}
.node.alt1,.node.alt2,.node.alt3{opacity:.62}
.alt-key{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.alt-key i{display:inline-block;width:15px;height:0;border-top:2px dashed currentColor;vertical-align:3px;margin-right:5px}

/* owl mode */
[data-owl="on"] .spiral{opacity:.14}
[data-owl="on"] .radius{opacity:.24}
[data-owl="on"] .frame-thread,[data-owl="on"] .guy{opacity:.3}
.onto-edge{fill:none;stroke:var(--dew);stroke-width:1.2;opacity:.5;vector-effect:non-scaling-stroke;marker-end:url(#arw)}
.onto-edge.hi{stroke:var(--amber);opacity:.95;stroke-width:1.8}

/* typed edge grammar — stroke pattern carries the epistemic state, and the
   word travels in a <title>; decision-inbound edges take authority gold.
   One shared context-stroke arrowhead marker (#arw) serves every type. */
.onto-edge.edge-inf{stroke:var(--ep-inferred);stroke-dasharray:5 3;opacity:.65;cursor:help}
.onto-edge.edge-ind{stroke:var(--ep-induced);stroke-dasharray:1.2 3;stroke-linecap:round;opacity:.65;cursor:help}
.onto-edge.edge-dec{stroke:var(--gold);opacity:.9;stroke-width:1.6}
/* lineage edges (traceability walk): inherit the SOURCE node's state colour */
.edge-lin{fill:none;stroke:var(--edge-src,var(--moth));stroke-width:2;vector-effect:non-scaling-stroke;marker-end:url(#arw)}
@keyframes edgePulse{0%,100%{opacity:.45}50%{opacity:.95}}
.edge-lin.degraded{stroke-dasharray:6 4;animation:edgePulse 2.4s ease-in-out infinite}
.edge-lbl{font-family:var(--mono);font-size:9px;fill:var(--faint);letter-spacing:.04em;pointer-events:none}
.owl-mark{opacity:0;transition:opacity .4s}
[data-owl="on"] .owl-mark{opacity:1}

/* ============================================================
   Tours + voice
   ============================================================ */
.tourbar{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;
  border:1px solid var(--amber-dim);border-radius:var(--r);background:var(--amber-wash);
}
.tourbar[hidden]{display:none}
.tourbar .tstep{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.tourbar .tsay{flex:1;min-width:220px;font-size:13px;color:var(--silk);line-height:1.5}
.tourbar button{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--ridge);color:var(--moth);border-radius:2px;padding:6px 10px;cursor:pointer;
}
.tourbar button:hover{color:var(--silk);border-color:var(--faint)}
.tour-pick{display:grid;gap:7px}
.tour-btn{
  text-align:left;background:transparent;border:1px solid var(--ridge);border-radius:var(--r);
  padding:10px 11px;cursor:pointer;color:var(--moth);font-family:var(--body);
}
.tour-btn:hover{border-color:var(--faint);color:var(--silk)}
.tour-btn b{display:block;color:var(--silk);font-size:13px;font-weight:600;margin-bottom:3px}
.tour-btn span{font-size:11.5px;line-height:1.45;color:var(--faint)}

/* ============================================================
   Manual (dialog)
   ============================================================ */
.modal{
  position:fixed;inset:0;z-index:60;background:rgba(8,10,15,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:24px;
}
.modal[hidden]{display:none}
[data-theme="light"] .modal{background:rgba(60,55,42,.5)}
.sheet{
  background:var(--deep);border:1px solid var(--ridge);border-radius:var(--r);
  max-width:860px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow);
}
.sheet-head{
  position:sticky;top:0;background:var(--deep);border-bottom:1px solid var(--ridge);
  padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:2;
}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:25px;margin:0;color:var(--silk)}
.sheet-body{padding:22px 24px 30px}
.sheet-body h3{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--amber);margin:26px 0 10px;
}
.sheet-body h3:first-child{margin-top:0}
.sheet-body p{font-size:13.5px;color:var(--moth);line-height:1.65;margin:0 0 11px}
.sheet-body p b,.sheet-body li b{color:var(--silk);font-weight:600}
.sheet-body ul{margin:0 0 11px;padding-left:18px;font-size:13.5px;color:var(--moth);line-height:1.65}
.keytable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:11px}
.keytable td{padding:6px 10px 6px 0;border-bottom:1px solid var(--ridge);color:var(--moth);vertical-align:top}
.keytable td:first-child{width:130px}
.keytable kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--dusk);border:1px solid var(--ridge);
  border-bottom-width:2px;border-radius:2px;padding:2px 6px;color:var(--silk);
}
.callout{border-left:2px solid var(--rust);padding:2px 0 2px 14px;margin:0 0 14px}
.callout p{margin:0;color:var(--moth)}

/* list view — the web as text, for anyone not using the picture */
.listview{margin-top:14px}
.listview[hidden]{display:none}
.lv-strand{border:1px solid var(--ridge);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.lv-head{
  width:100%;text-align:left;background:var(--deep);border:0;border-left:3px solid var(--strand-c);
  padding:11px 14px;cursor:pointer;color:var(--silk);font-family:var(--body);font-size:14px;font-weight:600;
}
.lv-head .sub{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em;margin-top:3px;font-weight:400}
.lv-items{list-style:none;margin:0;padding:0}
.lv-items li{border-top:1px solid var(--ridge)}
.lv-items button{
  width:100%;text-align:left;background:none;border:0;padding:9px 14px 9px 22px;cursor:pointer;
  color:var(--moth);font-family:var(--body);font-size:12.5px;
}
.lv-items button:hover{color:var(--silk);background:rgba(255,255,255,.03)}
.lv-items .cls{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:2px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);align-items:center}
.legend svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.legend svg *{fill:none;stroke:var(--moth);stroke-width:1.6}

/* ============================================================
   Print (BL-WEB-09) — governance packs go on paper. Printing the
   dark interactive stage makes a black rectangle, so print instead
   shows the existing text version (BL-WEB-10) of whatever collection
   is currently loaded: real content already built for this exact
   purpose, not a new page authored just for print. Scope is
   deliberately narrow — the Explore page's list view, not every page.
   ============================================================ */
@media print{
  *{background:#fff!important;color:#000!important;box-shadow:none!important;text-shadow:none!important}
  .topbar,.skip,#live,.tourbar,.modal,.zoomdock,.minimap,.arm-note,footer{display:none!important}
  .page{display:none!important}
  #pg-web{display:block!important}
  .grid{display:block!important}
  .rail-left,.rail-right,.stage,.how,.masthead .mast-controls,.mark-wrap{display:none!important}
  .rail-mid{display:block!important}
  .listview{display:block!important;margin:0}
  .listview[hidden]{display:block!important}
  .lv-strand{border:1px solid #999;border-radius:0;margin-bottom:14px;overflow:visible;page-break-inside:avoid}
  .lv-head{background:#eee;border-left:3px solid #000;color:#000}
  .lv-head .sub{color:#333}
  .lv-items button{color:#000}
  .lv-items .cls{color:#555}
  a{color:#000;text-decoration:underline}
}
</style>
