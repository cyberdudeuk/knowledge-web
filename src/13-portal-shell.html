<style>
/* ============================================================
   Portal shell — persistent chrome, one page at a time
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--glass-solid);border-bottom:1px solid var(--ridge);
  backdrop-filter:blur(10px);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:0 26px;display:flex;align-items:center;gap:18px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .bm{width:22px;height:22px;flex:0 0 22px}
.brand .bm *{fill:none;stroke:var(--amber);stroke-width:1.3}
.brand b{font-family:'Newsreader',serif;font-weight:400;font-size:17px;color:var(--silk);letter-spacing:.01em}
.brand span{
  font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rust);border:1px solid var(--rust);border-radius:2px;padding:2px 5px;
}
.pnav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.pnav a{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--moth);padding:8px 11px;border-bottom:2px solid transparent;border-radius:0;text-decoration:none;
}
.pnav a:hover{color:var(--silk);border-bottom-color:var(--ridge)}
.pnav a[aria-current="page"]{color:var(--amber);border-bottom-color:var(--amber)}
.colpick{
  background:var(--deep);border:1px solid var(--ridge);border-radius:2px;color:var(--silk);
  font-family:'Archivo',sans-serif;font-size:11.5px;padding:5px 7px;max-width:230px;
}

.page{display:none}
.page.on{display:block}
.page-head{padding:34px 0 20px;border-bottom:1px solid var(--ridge);margin-bottom:22px}
.page-head .eyebrow{margin-bottom:9px}
.page-head h2{font-family:'Newsreader',serif;font-weight:300;font-size:clamp(27px,3.6vw,40px);line-height:1.06;margin:0;color:var(--silk);letter-spacing:-.01em}
.page-head p{font-family:'Newsreader',serif;font-style:italic;font-size:16.5px;color:var(--moth);max-width:66ch;margin:12px 0 0;line-height:1.5}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:34px;align-items:start;padding:40px 0 26px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{margin-top:6px}
.hero .lede{
  font-family:'Newsreader',serif;font-size:19px;font-style:italic;color:var(--moth);
  max-width:56ch;margin:16px 0 0;line-height:1.5;
}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.cta{
  font-family:'Archivo',sans-serif;font-size:13.5px;font-weight:600;padding:10px 18px;cursor:pointer;
  border-radius:var(--r);border:1px solid var(--amber);background:var(--amber);color:var(--night);
}
.cta:hover{filter:brightness(1.08)}
.cta.ghost{background:transparent;color:var(--silk);border-color:var(--ridge)}
.cta.ghost:hover{border-color:var(--faint)}

.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px;margin-top:8px}
.card{
  border:1px solid var(--ridge);border-radius:var(--r);padding:18px 17px;background:var(--deep);
  cursor:pointer;text-align:left;color:inherit;font-family:'Archivo',sans-serif;
  display:flex;flex-direction:column;gap:7px;transition:border-color .18s,transform .18s;
}
.card:hover{border-color:var(--amber-dim);transform:translateY(-2px)}
.card .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.card h3{font-family:'Newsreader',serif;font-weight:400;font-size:20px;margin:0;color:var(--silk)}
.card p{margin:0;font-size:12.5px;color:var(--moth);line-height:1.55}
.card .n{
  margin-top:auto;padding-top:9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;
  letter-spacing:.06em;color:var(--faint);text-transform:uppercase;
}
.strip{
  display:flex;gap:26px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--ridge);
  border-bottom:1px solid var(--ridge);margin:26px 0;
}
.strip div .n{font-family:'Newsreader',serif;font-size:27px;color:var(--amber);line-height:1}
.strip div .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-top:4px}

.notice{
  border:1px solid var(--rust);border-left-width:3px;border-radius:var(--r);padding:13px 15px;margin:0 0 22px;
  background:rgba(201,111,76,.07);
}
.notice b{color:var(--silk);display:block;margin-bottom:4px;font-size:13px}
.notice p{margin:0;font-size:12.5px;color:var(--moth);line-height:1.6}

/* ---------- collections ---------- */
.colgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.colcard{border:1px solid var(--ridge);border-radius:var(--r);overflow:hidden;background:var(--deep)}
.colcard header{padding:16px 17px;border-bottom:1px solid var(--ridge)}
.colcard header .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.colcard header h3{font-family:'Newsreader',serif;font-weight:400;font-size:20px;margin:5px 0 0;color:var(--silk)}
.colcard .body{padding:15px 17px}
.colcard .body p{margin:0 0 11px;font-size:12.5px;color:var(--moth);line-height:1.6}
.colcard .facts{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.colcard .facts div{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.colcard .facts b{display:block;font-family:'Newsreader',serif;font-size:21px;color:var(--amber);letter-spacing:0;text-transform:none}
.colcard footer{padding:12px 17px;border-top:1px solid var(--ridge);display:flex;gap:8px;flex-wrap:wrap}
.colcard.live{border-color:var(--amber-dim)}
.bar{height:5px;background:var(--dusk);border-radius:3px;overflow:hidden;display:flex;margin:8px 0 4px}
.bar i{display:block;height:100%}
.barkey{display:flex;gap:13px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.barkey em{font-style:normal;width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}

/* ---------- masthead: spider to the extreme right of the title ---------- */
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap}
.title-row > .tblock{flex:1 1 460px;min-width:0}
.mark-wrap{flex:0 0 auto}
@media(max-width:760px){.title-row{flex-direction:column}}
</style>
