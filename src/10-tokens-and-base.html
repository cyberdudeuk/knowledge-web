<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Knowledge Web — a navigable map of everything built here</title>
<meta name="description" content="An orb web of the work, ideas and artefacts created across these conversations. Sit at the hub, pluck a thread, walk a radius, cross the spiral.">
<style>
:root{
  /* type — system stacks only; nothing fetched at runtime (BL-WEB-02) */
  --display:ui-serif,'Iowan Old Style','Palatino',Georgia,'Times New Roman',serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:23px;
  --night:#10141d;
  --deep:#161c28;
  --dusk:#1d2533;
  --ridge:#2b3547;
  --silk:#dfe7ee;
  --moth:#8e9aad;
  --faint:#77839a;
  --dew:#79d6cf;
  --dew-dim:#3d7e7b;
  --amber:#e3a044;
  --amber-dim:#8a6428;
  --rust:#c96f4c;
  --violet:#9a8ada;
  --ok:#6fbf8e;
  --r:3px;
  --shadow:0 18px 50px -22px rgba(0,0,0,.85);
  --glass:rgba(16,20,29,.84);
  --glass-solid:rgba(22,28,40,.97);
  --spiralc:rgba(143,155,175,.3);
  --violet-wash:rgba(154,138,218,.14);
  --amber-wash:rgba(227,160,68,.1);
  --mm-bg:rgba(10,13,19,.6);
  --alt1:#8c7fc4;
  --alt2:#5f9b86;
  --alt3:#a8785f;
  --scale:1;
  --sc-gov:#79d6cf; --sc-cda:#e3a044; --sc-obs:#9a8ada; --sc-cat:#6fbf8e; --sc-apps:#c96f4c;

  /* taxonomic layer — categorical ramp bound to taxonomy terms, never chart
     indices. Dark-theme derivations of the owner's evolved palette. */
  --cat-1:#4fc4a8; --cat-2:#6aa7e8; --cat-3:#a49aec; --cat-4:#e0a44e;
  --cat-5:#d98a6a; --cat-6:#e07a7a; --cat-7:#9aa4ad; --cat-8:#5f9bd6;

  /* epistemic layer — asserted ≠ inferred ≠ induced, plus stub and gated.
     Outline style carries the state too: solid / dashed / dotted / broken. */
  --ep-asserted:#6fbf8e;
  --ep-inferred:#b3a1e8;
  --ep-induced:#e0a44e;
  --ep-stub:#8a94a3;
  --ep-gated:#67718131;

  /* authority layer — committed decisions and ratified vocabulary only.
     Never shares a surface with focus amber. */
  --gold:#d4b45a;
  --gold-wash:rgba(212,180,90,.12);

  /* density — comfortable raises padding via one attribute, no mode CSS */
  --pad-panel:16px 15px;
  --pad-row:9px;
}
[data-density="comfortable"]{
  --pad-panel:22px 20px;
  --pad-row:13px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-size:calc(15px * var(--scale));
  background:var(--night);
  color:var(--silk);
  font-family:var(--body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 900px 620px at 62% 44%, rgba(121,214,207,.055), transparent 68%),
    radial-gradient(ellipse 700px 500px at 15% 88%, rgba(227,160,68,.04), transparent 70%);
  background-attachment:fixed;
}
a{color:var(--dew);text-decoration:none;border-bottom:1px solid rgba(121,214,207,.3)}
a:hover{border-bottom-color:var(--dew)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}

.mono{font-family:var(--mono)}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}

/* ---------- shell ---------- */
.shell{max-width:1560px;margin:0 auto;padding:0 26px 90px}

header.masthead{padding:44px 0 26px;border-bottom:1px solid var(--ridge);margin-bottom:22px}
.mast-top{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap}
h1{
  font-family:var(--display);font-weight:300;font-size:clamp(34px,5.2vw,60px);
  line-height:1.02;letter-spacing:-.015em;margin:8px 0 0;color:var(--silk);
}
h1 em{font-style:italic;color:var(--dew)}
.standfirst{
  font-family:var(--display);font-size:18px;font-weight:300;font-style:italic;
  color:var(--moth);max-width:60ch;margin:14px 0 0;line-height:1.5;
}
.tally{display:flex;gap:26px;flex-wrap:wrap;padding-bottom:6px}
.tally div{text-align:right}
.tally .n{font-family:var(--display);font-size:30px;font-weight:400;line-height:1;color:var(--amber)}
.tally .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:258px minmax(0,1fr) 336px;gap:20px;align-items:start}
@media(max-width:1240px){.grid{grid-template-columns:250px minmax(0,1fr)}.rail-right{grid-column:1/-1}}
@media(max-width:860px){.grid{grid-template-columns:1fr}}

.panel{
  background:linear-gradient(180deg,var(--deep),var(--night));
  border:1px solid var(--ridge);border-radius:var(--r);padding:var(--pad-panel);
}
.panel + .panel{margin-top:14px}
.panel h2{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:0 0 12px;
  display:flex;align-items:center;gap:9px;
}
.panel h2::after{content:'';flex:1;height:1px;background:var(--ridge)}

/* ---------- pluck (search) ---------- */
.pluck{position:relative}
.pluck input{
  width:100%;background:var(--night);border:1px solid var(--ridge);border-radius:var(--r);
  color:var(--silk);font-family:var(--body);font-size:14px;padding:11px 12px 11px 34px;
}
.pluck input::placeholder{color:var(--faint)}
.pluck input:focus{border-color:var(--dew-dim);outline:none;box-shadow:0 0 0 3px rgba(121,214,207,.09)}
.pluck .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;font-size:13px}
.pluck-hint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.45}
.pluck-hint kbd,.manual-hint kbd{
  font-family:var(--mono);font-size:10px;background:var(--dusk);
  border:1px solid var(--ridge);border-bottom-width:2px;border-radius:2px;padding:1px 4px;color:var(--moth);
}
.manual-hint{font-size:11.5px;color:var(--faint);line-height:1.45}

/* ---------- strand list ---------- */
.strand-btn{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  border-left:2px solid var(--ridge);padding:9px 0 9px 12px;margin-bottom:3px;cursor:pointer;
  color:var(--moth);font-family:var(--body);transition:border-color .18s,color .18s,background .18s;
}
.strand-btn:hover{background:rgba(255,255,255,.028);color:var(--silk)}
.strand-btn.on{border-left-color:var(--strand-c,var(--dew));color:var(--silk);background:rgba(255,255,255,.04)}
.strand-btn .nm{font-size:13.5px;font-weight:600;line-height:1.25;display:block}
.strand-btn .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--faint);margin-top:4px;display:block}
.strand-btn .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--strand-c,var(--dew));vertical-align:1px}

/* ---------- theme chips (the spiral) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  background:transparent;border:1px solid var(--ridge);border-radius:100px;color:var(--moth);
  padding:5px 10px;cursor:pointer;transition:.16s;
}
.chip:hover{border-color:var(--faint);color:var(--silk)}
.chip.on{background:var(--violet-wash);border-color:var(--violet);color:#cfc6f2}
.chip .ct{color:var(--faint);margin-left:5px}
.chip.on .ct{color:var(--violet)}

/* ---------- web stage ---------- */
.stage{
  position:relative;background:
    radial-gradient(circle at 50% 47%, rgba(121,214,207,.05), transparent 60%),
    linear-gradient(180deg,var(--deep),var(--night));
  border:1px solid var(--ridge);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
}
.stage svg{display:block;width:100%;height:auto;touch-action:manipulation}
.stage-tools{
  position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:4;
}
.tool{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--glass);border:1px solid var(--ridge);color:var(--moth);
  padding:6px 9px;border-radius:2px;cursor:pointer;backdrop-filter:blur(6px);
}
.tool:hover{color:var(--silk);border-color:var(--faint)}
.tool.on{color:var(--amber);border-color:var(--amber-dim)}

/* svg primitives */
.frame-thread{fill:none;stroke:var(--ridge);stroke-width:1.1;vector-effect:non-scaling-stroke}
.guy{stroke:var(--ridge);stroke-width:.9;stroke-dasharray:3 5;opacity:.75;vector-effect:non-scaling-stroke}
.radius{stroke:var(--faint);stroke-width:.85;opacity:.5;vector-effect:non-scaling-stroke;transition:stroke .22s,opacity .22s,stroke-width .22s}
.radius.lit{stroke:var(--strand-c);opacity:1;stroke-width:1.5}
.spiral{fill:none;stroke:var(--spiralc);stroke-width:.7;vector-effect:non-scaling-stroke;transition:opacity .3s}
.dim .spiral{opacity:.3}
.chord{fill:none;stroke:var(--violet);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .3s;pointer-events:none}
.chord.show{opacity:.55}

.node{cursor:pointer}
.node .halo{fill:transparent;stroke:none}
.node .bead{
  fill:var(--night);stroke:var(--strand-c);stroke-width:1.4;
  transition:r .2s,fill .2s,stroke-width .2s;
}
.node .lbl{
  font-family:var(--body);font-size:calc(16px * var(--scale));font-weight:500;fill:var(--moth);
  pointer-events:auto;transition:fill .2s,opacity .2s;
}
.node:hover .bead,.node.sel .bead{fill:var(--strand-c);stroke-width:2}
.node:hover .lbl,.node.sel .lbl{fill:var(--silk)}
.node.sel .bead{stroke:var(--amber);fill:var(--amber)}
.node.res .bead{stroke:var(--violet);fill:var(--violet)}
.node.res .lbl{fill:#cfc6f2}
.node.mute{opacity:.16}
.node.mute .lbl{opacity:0;pointer-events:none}
.node.open .bead{stroke-dasharray:2.5 2.5}

/* epistemic outline grammar — dash style carries the state, hue stays
   taxonomic, and the word travels in the aria-label, tooltip and pill */
.node.ep-inferred .bead{stroke-dasharray:5 2.5}
.node.ep-induced .bead{stroke-dasharray:1.1 2.6;stroke-linecap:round}
.node.ep-stub .bead{stroke-dasharray:8 4;opacity:.8}

/* consultation-maturity outline (BL-WEB-54, STD5 topics only) — a
   separate channel from epistemic state above: those two never coexist
   on the same bead here, since standards topics carry no inference.
   Endorsed is the unmarked default; Draft already reads via .open;
   Partially Endorsed gets its own, visually distinct dash rhythm. */
.node.mat-partial .bead{stroke-dasharray:4 1.5}

.cls-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;fill:var(--faint);opacity:0;transition:opacity .2s;pointer-events:none}
.node:hover .cls-lbl,.node.sel .cls-lbl,.node:focus-visible .cls-lbl{opacity:1}

/* epistemic pill — word always present, border style mirrors the outline */
.ep-pill{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid;border-radius:100px;padding:2px 8px;display:inline-block}
.ep-pill.asserted{color:var(--ep-asserted);border-color:var(--ep-asserted)}
.ep-pill.inferred{color:var(--ep-inferred);border-color:var(--ep-inferred);border-style:dashed}
.ep-pill.induced{color:var(--ep-induced);border-color:var(--ep-induced);border-style:dotted}
.ep-pill.stub{color:var(--ep-stub);border-color:var(--ep-stub);border-style:dashed}

/* pip meter — discrete 1–5, labelled, never a lone colour */
.pips{display:inline-flex;gap:3px;align-items:center;margin-right:10px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--dusk);border:1px solid var(--ridge)}
.pips i.on{background:var(--strand-c,var(--dew));border-color:transparent}
.pips .pl{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-right:3px}
.pips .pv{font-family:var(--mono);font-size:9px;color:var(--moth);margin-left:3px}

.hub-ring{fill:none;stroke:var(--amber-dim);stroke-width:1}
.hub-core{fill:var(--night);stroke:var(--amber);stroke-width:1.6}
.hub-lbl{font-family:var(--display);font-style:italic;font-size:17px;fill:var(--amber);text-anchor:middle;pointer-events:none}
.anchor-lbl{
  font-family:var(--mono);font-size:13px;letter-spacing:.13em;
  text-transform:uppercase;fill:var(--faint);
}
.strand-lbl{
  font-family:var(--body);font-size:calc(16.5px * var(--scale));font-weight:700;letter-spacing:.01em;
  fill:var(--strand-c);cursor:pointer;
}
.strand-lbl:hover{fill:var(--silk)}

/* vibration pulse */
.pulse{fill:none;stroke:var(--dew);stroke-width:2;opacity:0}
@keyframes travel{0%{stroke-dashoffset:var(--len);opacity:.95}100%{stroke-dashoffset:0;opacity:0}}
.pulse.go{animation:travel .62s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes ripple{0%{r:6;opacity:.75}100%{r:52;opacity:0}}
.ripple{fill:none;stroke:var(--dew);stroke-width:1.2;animation:ripple .9s ease-out forwards}

/* spider */
#spider{transition:transform .85s cubic-bezier(.45,.05,.25,1)}
#spider path,#spider circle{stroke:var(--amber);fill:none;stroke-width:1.2;stroke-linecap:round}
#spider .body{fill:var(--amber)}

/* dew tooltip */
.tip{
  position:absolute;pointer-events:none;z-index:6;opacity:0;transform:translateY(4px);
  transition:opacity .14s,transform .14s;max-width:250px;
  background:var(--glass-solid);border:1px solid var(--ridge);border-radius:var(--r);
  padding:9px 11px;box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.tip.on{opacity:1;transform:translateY(0)}
.tip .t{font-size:12.5px;font-weight:600;color:var(--silk);line-height:1.3}
.tip .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--faint);text-transform:uppercase;margin-top:5px}

/* ---------- detail rail ---------- */
.rail-right{position:sticky;top:18px}
.detail-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--strand-c,var(--dew))}
.detail-title{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.15;margin:7px 0 0;color:var(--silk)}
.detail-body{font-size:13.5px;color:var(--moth);line-height:1.6;margin:11px 0 0}
.detail-body strong{color:var(--silk);font-weight:600}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--ridge);border-radius:100px;padding:3px 9px;color:var(--moth);
}
.pill.open{border-color:var(--rust);color:var(--rust)}
.pill.done{border-color:var(--dew-dim);color:var(--dew)}
.pill.active{border-color:var(--amber-dim);color:var(--amber)}
.pill.mat-partial{border-color:var(--amber-dim);color:var(--amber);border-style:dashed}
#cDisplayCount{margin-left:6px;padding:1px 6px}
.xref{margin-top:16px;border-top:1px solid var(--ridge);padding-top:13px}
.xref-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.xref-item{
  display:block;width:100%;text-align:left;background:transparent;border:0;padding:6px 0 6px 14px;cursor:pointer;
  position:relative;color:var(--moth);font-size:12.5px;line-height:1.4;font-family:var(--body);
}
.xref-item::before{content:'';position:absolute;left:0;top:13px;width:8px;height:1px;background:var(--violet)}
.xref-item:hover{color:var(--silk)}
.xref-item .src{font-family:var(--mono);font-size:9px;color:var(--faint);display:block;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

.empty{color:var(--faint);font-size:13px;line-height:1.6;font-style:italic;font-family:var(--display)}

/* ---------- node inspector quadrant ----------
   attributes | provenance / outgoing | inbound — hairline-divided 2×2.
   Inferred (materialised inverse) edges carry a dashed pill and hue. */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ridge);border:1px solid var(--ridge);border-radius:var(--r);overflow:hidden;margin-top:14px}
.quad>div{background:var(--deep);padding:10px 11px;min-width:0}
.quad h4{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 7px}
.quad .qrow{font-size:11.5px;color:var(--moth);line-height:1.5;margin:0 0 4px}
.quad .qrow b{color:var(--silk);font-weight:600}
.quad .qk{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.qedge{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;font-size:11.5px;color:var(--moth);font-family:var(--body);line-height:1.4}
.qedge:hover{color:var(--silk)}
.qedge .qp{font-family:var(--mono);font-size:9px;color:var(--dew);letter-spacing:.04em}
.qedge.qinf .qp{color:var(--ep-inferred)}
.qedge .qep{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ep-inferred);border:1px dashed var(--ep-inferred);border-radius:100px;padding:0 5px;margin-left:5px}

/* ---------- repair list ---------- */
.repair{list-style:none;margin:0;padding:0}
.repair li{padding:9px 0 9px 16px;border-bottom:1px dashed var(--ridge);position:relative;font-size:12.5px;color:var(--moth);line-height:1.45}
.repair li:last-child{border-bottom:0}
.repair li::before{content:'';position:absolute;left:0;top:15px;width:7px;height:7px;border:1px solid var(--rust);transform:rotate(45deg)}
.repair li b{color:var(--silk);font-weight:600;display:block;margin-bottom:2px}

/* ---------- how a spider navigates ---------- */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:1px;background:var(--ridge);border:1px solid var(--ridge);border-radius:var(--r);margin-top:30px;overflow:hidden}
.how > div{background:var(--night);padding:15px 15px}
.how .step{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.how h3{font-family:var(--display);font-weight:400;font-size:17px;margin:7px 0 5px;color:var(--silk)}
.how p{margin:0;font-size:12.5px;color:var(--moth);line-height:1.55}
.how p b{color:var(--dew);font-weight:500}
.how-mini{margin:14px 0}
.how-mini p{margin:4px 0;font-size:12px;color:var(--moth);line-height:1.4}
.how-mini p b{color:var(--dew)}

footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--ridge);font-size:12px;color:var(--faint);line-height:1.6}
footer b{color:var(--moth);font-weight:600}


/* ---------- viewport: zoom, pan, fullscreen ---------- */
.stage{--mm:0}
.stage.grab{cursor:grab}
.stage.grabbing{cursor:grabbing}
.stage svg{user-select:none}
#stage:fullscreen,#stage:-webkit-full-screen{width:100vw;height:100vh;border-radius:0;border:0}
#stage:fullscreen svg,#stage:-webkit-full-screen svg{width:100%;height:100vh}
#vp{transition:transform .32s cubic-bezier(.4,.05,.2,1)}
#vp.now{transition:none}

.zoomdock{
  position:absolute;left:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:5px;
}
.zbtn{
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;
  background:var(--glass);border:1px solid var(--ridge);color:var(--moth);
  border-radius:2px;font-family:var(--mono);font-size:13px;line-height:1;
  backdrop-filter:blur(6px);padding:0;
}
.zbtn:hover{color:var(--silk);border-color:var(--faint)}
.zbtn.on{color:var(--amber);border-color:var(--amber-dim)}
.zlevel{
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint);
  text-align:center;padding:3px 0;
}

/* ---------- picture-in-picture minimap ---------- */
.minimap{
  position:absolute;right:12px;bottom:12px;z-index:5;width:186px;
  background:var(--glass-solid);border:1px solid var(--ridge);border-radius:var(--r);
  backdrop-filter:blur(8px);box-shadow:var(--shadow);overflow:hidden;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s;
}
.minimap.on{opacity:1;transform:translateY(0);pointer-events:auto}
.minimap .mm-head{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:6px 8px;border-bottom:1px solid var(--ridge);
