publiccodeYmlVersion: '0'
name: The Knowledge Web
url: https://github.com/cyberdudeuk/knowledge-web
landingURL: https://cyberdudeuk.github.io/knowledge-web/dist/the-web.html
softwareVersion: 3.8.0
platforms:
- web
categories:
- knowledge-management
developmentStatus: development
softwareType: standalone/web
description:
  en:
    shortDescription: A navigable, ontology-backed map of UK government data standards, governance and knowledge
      management, in one offline file.
    longDescription: 'A navigable, ontology-backed map of a body of work on UK government data standards, governance
      and knowledge management, delivered as one self-contained file that works offline. It is for: People mapping
      or navigating a large body of knowledge. Status, as the project states it: Prototype. Not official government
      guidance or policy unless the project says otherwise.'
    documentation: https://cyberdudeuk.github.io/knowledge-web/dist/the-web.html
    features:
    - Six collections drawn as navigable webs
    - Ontology layer with a reasoner that shows entailments
    - Taxonomy, thesaurus, glossary and data dictionary
    - Every collection declares its gaps
    - Text view with the same content as the picture
