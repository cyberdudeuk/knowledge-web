name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build + degraded + verify
        run: npm run check

      - name: Upload dist artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-web-dist
          path: dist/the-web.html
          retention-days: 14
